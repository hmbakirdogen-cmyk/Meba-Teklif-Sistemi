# Render.com Blueprint — Meba Teklif Sistemi
# Tek Web Service (Express + tsx) + managed Postgres.
# Cloudflare R2 ve Resend env vars sync:false → ilk deploy'da manuel set.
services:
  - type: web
    name: meba-teklif
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    # --include=dev: NODE_ENV=production ortamında devDependencies (typescript,
    # @types/node, vite types, prisma CLI) build için gerekli; aksi halde
    # `tsc -b` "Cannot find type definition file for 'vite/client'" verir.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meba-pg
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # SMTP_ENCRYPTION_KEY — 32 byte (64 hex char). Kullanıcı SMTP şifrelerini
      # AES-256-GCM ile şifreler. generateValue Render'da otomatik üretir.
      # NOT: Bu key değişirse mevcut şifrelenmiş şifreler decrypt edilemez!
      - key: SMTP_ENCRYPTION_KEY
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

databases:
  - name: meba-pg
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: 16
