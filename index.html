<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teklif Yönetim Sistemi</title>
    <!-- PWA — masaüstü/Android kurulumu (HTTPS veya localhost gerekli) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E3A5F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Teklif Yönetim Sistemi" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&display=swap" rel="stylesheet" />
    <!-- Tema flash önleme: React yüklenmeden önce data-theme ayarla -->
    <script>
      try {
        var t = localStorage.getItem('meba_tema') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    </script>
    <!--
      AGRESİF one-shot reset (vBust11 — Faz 18, navbar tıklanmama bug'ı için
      bir kere daha sıfırlama):
        • Tüm Service Worker'ları unregister
        • Tüm caches.delete (HTTP cache + SW cache)
        • Eski auth + session localStorage'larını da temizle (re-login zorla)
        • Bir kez tetiklenir (VBUST_KEY flag); yeni dağıtımda key artır.
    -->
    <script>
      (function() {
        var VBUST_KEY = 'meba_cache_bust_v11';
        try {
          if (localStorage.getItem(VBUST_KEY) === '1') return;
        } catch (e) { return; }
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function(rs) {
              return Promise.all(rs.map(function(r) { return r.unregister(); }));
            }).catch(function() {})
          );
        }
        if (typeof caches !== 'undefined' && caches.keys) {
          tasks.push(
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).catch(function() {})
          );
        }
        // Eski auth + session anahtarlarını temizle — kullanıcı yeniden
        // login olsun. Tema, PDF kayıt klasörü vb. KORUNUR (whitelist
        // dışındaki "meba_" anahtarları silinir).
        try {
          var korunan = {
            'meba_tema': 1,
            'meba_cache_bust_v8': 1,
            'meba_cache_bust_v9': 1,
            'meba_cache_bust_v10': 1,
            'meba_cache_bust_v11': 1,
            'meba_pdf_klasor_handle': 1,
            'meba_pdf_klasor_ad': 1,
          };
          var silinecek = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && (k.indexOf('meba_') === 0 || k.indexOf('auth') === 0 || k.indexOf('token') === 0) && !korunan[k]) {
              silinecek.push(k);
            }
          }
          for (var j = 0; j < silinecek.length; j++) localStorage.removeItem(silinecek[j]);
          sessionStorage.clear();
        } catch (e) {}
        Promise.all(tasks).then(function() {
          try { localStorage.setItem(VBUST_KEY, '1'); } catch (e) {}
          var didReload = sessionStorage.getItem('meba_vbust_reloaded');
          if (didReload !== '1') {
            try { sessionStorage.setItem('meba_vbust_reloaded', '1'); } catch (e) {}
            location.replace(location.pathname + '?vbust=' + Date.now());
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
